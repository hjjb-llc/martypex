name: Bug report
description: Something isn't working as expected
title: "[BUG] "
labels: ["t:bug", "s:needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for filing a bug. The more we know, the faster we can fix it. If Martypex quit unexpectedly, use the crash report form instead.
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: A clear description of the problem and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: How can we reproduce this ourselves? If a document triggers it, paste the smallest piece of Typst or Markdown that shows the problem.
      placeholder: |
        1.
        2.
        3.
    validations:
      required: true
  - type: input
    id: app_version
    attributes:
      label: Martypex version
      description: Find this in Settings > About.
      placeholder: "1.0 (1)"
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Device model
      placeholder: "e.g. iPhone 17 Pro, iPad Pro 13-inch (M5)"
    validations:
      required: true
  - type: input
    id: os_version
    attributes:
      label: iOS version
      placeholder: "e.g. iOS 27.0"
    validations:
      required: true
  - type: textarea
    id: additional
    attributes:
      label: Additional context
      description: Screenshots, logs, hunches.
    validations:
      required: false
